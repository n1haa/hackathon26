[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cashflow-workspace"
version = "0.1.0"
description = "Integrated CashFlow UI, classification, forecasting and risk analysis"
requires-python = ">=3.10,<3.14"
dependencies = [
  "streamlit>=1.50,<2", "pandas>=2.1,<3", "numpy>=1.24,<3",
  "plotly>=5.20,<7", "openpyxl>=3.1,<4", "requests>=2,<3",
  "scikit-learn>=1.3,<2", "joblib>=1.3", "threadpoolctl>=3.1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2", "ruff>=0.9,<1", "wheel", "setuptools>=68"]

[project.scripts]
cashflow = "cashflow_app.cli:main"

[tool.setuptools]
packages = ["cashflow", "cashflow_web", "cashflow_app", "forecasting", "transaction_classifier", "cashflow_integrated"]
py-modules = ["risk_engine", "recurring_detector"]
package-dir = {"" = "packages/risk", cashflow = "apps/web/cashflow", cashflow_web = "apps/web", cashflow_app = "packages/integration/cashflow_app", forecasting = "packages/analytics/forecasting", transaction_classifier = "packages/analytics/transaction_classifier", cashflow_integrated = "packages/risk/cashflow_integrated"}
include-package-data = false

[tool.setuptools.package-data]
cashflow_integrated = ["C002.csv"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/analytics/tests", "packages/risk"]
addopts = "--import-mode=importlib"
norecursedirs = [".venv", "artifacts", "build", "dist"]

[tool.ruff]
target-version = "py310"
exclude = [".venv", ".venv-*", "build", "dist"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
